  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at 50% 30%, #2a2a35 0%, #15151c 70%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    header { padding: 14px 18px; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: .3px; flex: 0 0 auto; }
    .stage { flex: 1 1 auto; position: relative; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; background: transparent; }

    /* AR 버튼 */
    .ar-button {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: #ffffff; color: #15151c; border: none; border-radius: 999px;
      padding: 13px 26px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.35);
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    .ar-button:active { transform: translateX(-50%) scale(.97); }
    .ar-button svg { width: 18px; height: 18px; }
    /* AR 미지원 기기에서도 버튼을 항상 표시 (model-viewer 기본 숨김 무시) */
    button[slot="ar-button"] { display: inline-flex !important; }

    /* 로딩 표시 */
    .progress-bar {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 180px; height: 5px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden;
    }
    .progress-bar .fill { height: 100%; width: 0%; background: #fff; transition: width .2s; }
    .progress-bar[hidden] { display: none; }

    .hint { flex: 0 0 auto; text-align: center; font-size: 12px; color: #9a9aa8; padding: 8px 18px 14px; line-height: 1.5; }
  </style>

<p style="margin:10px 0 0;font-size:14px;line-height:1.5">스마트폰 카메라로 찍으면<br><b>10707 김*후</b> 작품이 열려요.<br><span style="color:#667">아무 곳이나 누르면 닫혀요</span></p></div></div><style>#wb-qr[hidden]{display:none!important}</style>

  <div class="stage">
    <model-viewer
      id="viewer"
      src="model.glb"
      alt="10707 김*후"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      auto-rotate-delay="0"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      ar
      ar-modes="scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      ios-src="model.usdz">

      <button class="ar-button" slot="ar-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 7v10l9 5 9-5V7z"/>
          <path d="M3 7l9 5 9-5"/>
          <path d="M12 22V12"/>
        </svg>
        AR로 보기
      </button>

      <div class="progress-bar" slot="progress-bar">
        <div class="fill"></div>
      </div>
    </model-viewer>
  </div>

  <div class="hint">
    드래그(또는 손가락)로 회전 · 두 손가락으로 확대/축소<br />
    <b>AR로 보기</b>를 누르면 카메라가 켜지고 현실 공간에 모델이 나타납니다.
  </div>

  <script>
    const mv = document.getElementById('viewer');
    const bar = mv.querySelector('.progress-bar');
    const fill = mv.querySelector('.progress-bar .fill');

    mv.addEventListener('progress', (e) => {
      const p = e.detail.totalProgress;
      fill.style.width = (p * 100) + '%';
      bar.toggleAttribute('hidden', p === 1);
    });

    // AR 미지원 기기 안내
    mv.addEventListener('load', () => {
      if (!mv.canActivateAR) {
        const btn = mv.querySelector('.ar-button');
        if (btn) {
          btn.addEventListener('click', () => {
            alert('이 기기/브라우저에서는 AR을 지원하지 않습니다.\n안드로이드는 Chrome, 아이폰은 Safari에서 열어주세요.');
          });
        }
      }
    });
  </script>
